<!doctype html>
<html lang="en">
	<head>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<script src="script.js" defer></script>
		<link rel="stylesheet" href="style.css" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tic Tac Toe</title>
	</head>
	<body>
		<div class="starting-screen" id="screen">
			<div class="heading">
				<h1>Tic Tac Toe</h1>
			</div>

			<div class="form-container">
				<form class="form starting-form">
					<div class="player-one">
						<label for="player1">Player 1</label>
						<input type="text" id="player1" />
					</div>
					<div class="player-two">
						<label for="player2">Player 2</label>
						<input type="text" id="player2" />
					</div>
				</form>
			</div>
			<div class="start-game-btn starting-btn">
				<button form="form" id="start-btn">Start</button>
			</div>
		</div>
		<div class="game">
			<div class="turn"></div>
			<div class="board"></div>
		</div>
	</body>
</html>
